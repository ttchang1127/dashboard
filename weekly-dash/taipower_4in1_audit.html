<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台電4合1專案稽核摘要</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3efe7;
            --panel: #fffdf8;
            --ink: #1f2937;
            --line: #e7ddcf;
            --teal: #1f766e;
        }
        body {
            font-family: "DM Sans", "Noto Sans TC", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(201, 111, 59, 0.12), transparent 30%),
                radial-gradient(circle at right 20%, rgba(31, 118, 110, 0.12), transparent 24%),
                linear-gradient(180deg, #f8f5ef 0%, var(--bg) 100%);
            color: var(--ink);
        }
        .panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,253,248,0.96));
            border: 1px solid var(--line);
            box-shadow: 0 12px 36px rgba(98, 72, 44, 0.08);
        }
        .summary-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.98), rgba(248,241,231,0.95));
            border: 1px solid var(--line);
        }
        .pill {
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 9999px;
            padding: 0.25rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .item-card {
            border: 1px solid rgba(31, 118, 110, 0.16);
            background: rgba(236, 253, 245, 0.68);
        }
        .pending-card {
            border: 1px solid rgba(120, 113, 108, 0.18);
            background: rgba(250, 250, 249, 0.74);
        }
        .section-anchor.active {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
        }
        .tab-strip {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            scrollbar-width: thin;
        }
        .tab-button {
            min-width: 9.5rem;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.82);
            color: #57534e;
            border-radius: 0.75rem;
            padding: 0.75rem 0.9rem;
            text-align: left;
            transition: 0.18s ease;
        }
        .tab-button.active {
            background: #1f2937;
            border-color: #1f2937;
            color: white;
            box-shadow: 0 10px 24px rgba(31, 41, 55, 0.18);
        }
        .tab-button:focus-visible {
            outline: 3px solid rgba(31, 118, 110, 0.35);
            outline-offset: 2px;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden p-4 lg:p-8">
    <div class="mx-auto max-w-7xl space-y-6">
        <header class="panel rounded-[28px] p-6 lg:p-8">
            <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
                <div class="space-y-3">
                    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-stone-500">Taipower Project Audit</p>
                    <div>
                        <h1 class="text-3xl font-bold leading-tight lg:text-5xl">台電4合1專案稽核摘要</h1>
                        <p class="mt-2 break-words text-stone-500">依台電4合1提醒清單 V2 產出，共同項目與四案分區列管。</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:min-w-[420px]">
                    <div class="summary-card rounded-2xl p-4">
                        <p class="text-xs text-stone-500">提醒清單</p>
                        <p id="versionText" class="mt-1 text-lg font-bold">載入中</p>
                    </div>
                    <div class="summary-card rounded-2xl p-4">
                        <p class="text-xs text-stone-500">稽核日</p>
                        <p id="auditDateText" class="mt-1 text-lg font-bold">載入中</p>
                    </div>
                </div>
            </div>
        </header>

        <section class="panel rounded-[28px] p-5 lg:p-6">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                <div>
                    <p class="text-sm font-semibold uppercase tracking-[0.16em] text-stone-500">Project Summary</p>
                    <h2 class="text-2xl font-bold">專案稽核摘要</h2>
                </div>
                <p id="metaText" class="break-words text-xs text-stone-500"></p>
            </div>
            <div id="summaryGrid" class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-6"></div>
            <div id="anchorBar" class="tab-strip mt-5" role="tablist" aria-label="台電4合1分頁"></div>
        </section>

        <main id="sections" class="space-y-6">
            <div class="panel rounded-[24px] p-6 text-stone-500">資料載入中...</div>
        </main>
    </div>

    <script src="./taipower_4in1_audit.js?v=20260730-1640"></script>
</body>
</html>
